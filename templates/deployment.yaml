apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prism
  labels:
    app.kubernetes.io/name: spotlight-prism
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spotlight-prism
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotlight-prism
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: prism
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ .Values.args | toJson }}
          ports:
            - name: http
              containerPort: 4010
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
