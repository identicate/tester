apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prism
  labels:
    app.kubernetes.io/name: spotlight-prism
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 4010
  selector:
    app.kubernetes.io/name: spotlight-prism
    app.kubernetes.io/instance: {{ .Release.Name }}
